<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <title>스네이크 아케이드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1110;
      --panel: #121c19;
      --grid: #1b2924;
      --green: #65e572;
      --green-bright: #a1ff85;
      --text: #edf6ef;
      --muted: #91a49a;
      --accent: #ff6470;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px max(24px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 15%, #14241d 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100%, 520px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 7vw, 2.35rem);
      letter-spacing: 0.04em;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 10px;
      padding: 12px 16px;
      border: 1px solid #263830;
      border-radius: 14px;
      background: #101916;
    }

    .score-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    #score {
      color: var(--green-bright);
      font-size: 1.35rem;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    #status {
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .board-wrap {
      position: relative;
      width: min(100%, 520px, 58vh);
      margin: 0 auto;
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid #2a4035;
      border-radius: 14px;
      background: #101916;
      box-shadow: 0 14px 40px #0008, 0 0 24px #65e57212;
      touch-action: none;
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(20, 1fr);
      gap: 1px;
      padding: 5px;
      background-color: #101916;
    }

    .cell {
      min-width: 0;
      min-height: 0;
      border-radius: 2px;
      background: var(--grid);
    }

    .cell.snake {
      background: var(--green);
      box-shadow: inset 0 0 0 1px #b4ff9c55, 0 0 7px #65e57255;
    }

    .cell.head {
      background: var(--green-bright);
      border-radius: 4px;
      box-shadow: 0 0 10px #a1ff8599;
    }

    .cell.food {
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px #ff647099;
      transform: scale(0.72);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #07100dcc;
      backdrop-filter: blur(3px);
    }

    .overlay[hidden] { display: none; }

    .overlay-card {
      max-width: 280px;
    }

    .overlay-title {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 7vw, 2rem);
      font-weight: 900;
    }

    .overlay-text {
      margin: 0;
      color: #c1d0c7;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 14px 0 10px;
    }

    button {
      min-height: 48px;
      border: 1px solid #30443a;
      border-radius: 12px;
      background: #17231e;
      color: var(--text);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 2px;
    }

    button:active { transform: translateY(1px); }

    .controls button { flex: 1; }

    #startBtn {
      border-color: #65e572;
      background: #1d6336;
    }

    .mobile-controls {
      width: 186px;
      margin: 14px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 54px);
      gap: 7px;
      justify-content: center;
      user-select: none;
    }

    .mobile-controls button {
      min-height: 54px;
      font-size: 1.35rem;
      background: #17231e;
      border-color: #344b3e;
      touch-action: none;
      user-select: none;
    }

    .mobile-controls .up { grid-column: 2; grid-row: 1; }
    .mobile-controls .left { grid-column: 1; grid-row: 2; }
    .mobile-controls .down { grid-column: 2; grid-row: 2; }
    .mobile-controls .right { grid-column: 3; grid-row: 2; }

    .help {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (min-width: 700px) and (pointer: fine) {
      .mobile-controls { display: none; }
    }

    @media (max-height: 700px) {
      body { padding-top: 12px; padding-bottom: 12px; }
      .topbar { margin-top: 10px; }
      .mobile-controls { margin-top: 9px; }
      .help { margin-top: 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Arcade • Snake</p>
    <h1>스네이크</h1>

    <section class="topbar" aria-label="게임 점수">
      <span class="score-label">SCORE</span>
      <span id="score" aria-live="polite">0</span>
    </section>

    <div id="status" aria-live="polite">시작 버튼을 눌러 게임을 시작하세요.</div>

    <section class="board-wrap" aria-label="20 곱하기 20 게임판">
      <div id="board" role="img" aria-label="스네이크 게임판"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="overlay-title" id="overlayTitle">준비됐나요?</p>
          <p class="overlay-text" id="overlayText">시작 버튼을 눌러 게임을 시작하세요.</p>
        </div>
      </div>
    </section>

    <div class="controls">
      <button id="startBtn" type="button">게임 시작</button>
      <button id="pauseBtn" type="button">일시정지</button>
      <button id="restartBtn" type="button">다시 시작</button>
    </div>

    <div class="mobile-controls" aria-label="터치 방향 조작">
      <button class="up" type="button" data-dir="up" aria-label="위로">▲</button>
      <button class="left" type="button" data-dir="left" aria-label="왼쪽으로">◀</button>
      <button class="down" type="button" data-dir="down" aria-label="아래로">▼</button>
      <button class="right" type="button" data-dir="right" aria-label="오른쪽으로">▶</button>
    </div>

    <p class="help">PC: 방향키 또는 WASD · 일시정지: 스페이스바<br>모바일·태블릿: 화면 방향 버튼을 사용하세요.</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 20;
      const STEP_MS = 125;
      const board = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");

      const cells = [];
      for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        board.appendChild(cell);
        cells.push(cell);
      }

      const directions = {
        up:    { x: 0, y: -1 },
        down:  { x: 0, y: 1 },
        left:  { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake, direction, queuedDirection, food, score;
      let timer = null;
      let state = "ready"; // ready, running, paused, over

      function indexOf(point) {
        return point.y * SIZE + point.x;
      }

      function randomFood() {
        const empty = [];
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!snake.some(part => part.x === x && part.y === y)) {
              empty.push({ x, y });
            }
          }
        }
        return empty.length
          ? empty[Math.floor(Math.random() * empty.length)]
          : null;
      }

      function render() {
        for (const cell of cells) cell.className = "cell";

        if (food) cells[indexOf(food)].classList.add("food");

        snake.forEach((part, i) => {
          cells[indexOf(part)].classList.add(i === 0 ? "head" : "snake");
        });

        scoreEl.textContent = String(score);
      }

      function showOverlay(title, text) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.hidden = false;
      }

      function hideOverlay() {
        overlay.hidden = true;
      }

      function reset() {
        clearInterval(timer);
        timer = null;
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ];
        direction = directions.right;
        queuedDirection = null;
        score = 0;
        food = randomFood();
        state = "ready";
        render();
        statusEl.textContent = "시작 버튼을 눌러 게임을 시작하세요.";
        startBtn.textContent = "게임 시작";
        pauseBtn.textContent = "일시정지";
        showOverlay("준비됐나요?", "시작 버튼을 눌러 게임을 시작하세요.");
      }

      function start() {
        if (state === "running") return;
        if (state === "over") reset();
        state = "running";
        hideOverlay();
        statusEl.textContent = "게임 진행 중";
        startBtn.textContent = "게임 중";
        timer = setInterval(tick, STEP_MS);
      }

      function pause() {
        if (state === "running") {
          clearInterval(timer);
          timer = null;
          state = "paused";
          statusEl.textContent = "일시정지";
          startBtn.textContent = "계속하기";
          pauseBtn.textContent = "계속하기";
          showOverlay("일시정지", "시작 버튼 또는 계속하기를 눌러 이어서 플레이하세요.");
        } else if (state === "paused") {
          start();
          pauseBtn.textContent = "일시정지";
        }
      }

      function endGame(won = false) {
        clearInterval(timer);
        timer = null;
        state = "over";
        statusEl.textContent = won ? "게임판을 모두 채웠습니다!" : "게임 종료";
        startBtn.textContent = "게임 시작";
        pauseBtn.textContent = "일시정지";
        showOverlay(won ? "완벽해요!" : "게임 오버", `최종 점수: ${score}점 · 다시 시작을 눌러 재도전하세요.`);
      }

      function tick() {
        if (queuedDirection) {
          direction = queuedDirection;
          queuedDirection = null;
        }

        const head = snake[0];
        const next = { x: head.x + direction.x, y: head.y + direction.y };
        const eating = food && next.x === food.x && next.y === food.y;

        if (next.x < 0 || next.x >= SIZE || next.y < 0 || next.y >= SIZE) {
          endGame();
          return;
        }

        // 먹이를 먹지 않는 이동에서는 꼬리가 한 칸 빠지므로, 빠질 꼬리 칸 진입은 허용합니다.
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        if (bodyToCheck.some(part => part.x === next.x && part.y === next.y)) {
          endGame();
          return;
        }

        snake.unshift(next);

        if (eating) {
          score += 10;
          food = randomFood();
          if (!food) {
            render();
            endGame(true);
            return;
          }
        } else {
          snake.pop();
        }

        render();
      }

      function requestDirection(name) {
        if (state === "over") return;

        const next = directions[name];
        if (!next) return;

        // 현재 이동 방향(또는 이미 예약된 방향)의 정반대 전환은 무시합니다.
        const reference = queuedDirection || direction;
        if (next.x === -reference.x && next.y === -reference.y) return;

        // 한 틱에 한 번만 회전 예약: 버튼을 연타해도 방향이 꼬이지 않습니다.
        queuedDirection = next;

        if (state === "ready") start();
      }

      startBtn.addEventListener("click", () => {
        if (state === "paused") {
          start();
          pauseBtn.textContent = "일시정지";
        } else {
          start();
        }
      });

      pauseBtn.addEventListener("click", pause);
      restartBtn.addEventListener("click", () => {
        reset();
        start();
      });

      document.addEventListener("keydown", event => {
        const keyMap = {
          ArrowUp: "up", w: "up", W: "up",
          ArrowDown: "down", s: "down", S: "down",
          ArrowLeft: "left", a: "left", A: "left",
          ArrowRight: "right", d: "right", D: "right"
        };

        if (keyMap[event.key]) {
          event.preventDefault();
          requestDirection(keyMap[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "running" || state === "paused") pause();
          else if (state === "ready") start();
        }
      });

      document.querySelectorAll("[data-dir]").forEach(button => {
        const choose = event => {
          event.preventDefault();
          requestDirection(button.dataset.dir);
        };
        button.addEventListener("pointerdown", choose);
        button.addEventListener("click", event => {
          // 키보드로 버튼을 누른 경우도 지원합니다. 포인터 입력은 pointerdown에서 처리합니다.
          if (event.detail === 0) requestDirection(button.dataset.dir);
        });
      });

      reset();
    })();
  </script>
</body>
</html>
